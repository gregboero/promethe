# Connect to a separately installed and contract-tested Honcho service.
# Upstream requires an API, worker, pgvector and Redis; the former single
# plasticlabs/honcho:latest example was not a verified installation.
# See docs/DEPLOYMENT.md for upstream setup and compatibility requirements.
services:
  promethe-core:
    environment:
      - MEMORY_PROVIDER=honcho
      - HONCHO_URL=${HONCHO_URL:?Set the URL of your tested Honcho service}
      - HONCHO_API_KEY=${HONCHO_API_KEY:?Set a dedicated Honcho test key}
