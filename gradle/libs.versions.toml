[versions]
kotlin = "2.4.10"
ktor = "3.5.2"
koog-stable = "1.2.0"
koog-beta = "1.2.0-beta"
kotlin-logging = "8.0.4"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
okio = "3.18.2"
shadow = "9.6.1"
tracy = "0.1.0"
mordant = "3.1.0"
exposed = "1.5.0"
sqlite-jdbc = "3.53.4.0"
flyway = "13.5.0"
bouncycastle = "1.85.2"
markdown-renderer = "0.45.0"
kover = "0.9.9"
koin-bom = "4.2.2"
compose-multiplatform = "1.12.0"
skiko = "0.150.1"
navigation3 = "1.1.1"
jda = "6.6.0"
twilio = "13.0.0"
opentelemetry = "1.65.0"
logback = "1.6.3"
jline = "4.4.2"
activity-compose = "1.13.0"
agp = "9.1.1"
ktlint-plugin = "14.2.0"
ktlint-engine = "1.8.0"
netty = "4.2.17.Final"
jackson2 = "2.22.2"
jackson3 = "3.1.6"
httpclient5 = "5.6.3"
httpcore5 = "5.4.3"
npm-ws = "8.21.3"
npm-webpack = "5.110.3"
npm-webpack-dev-server = "5.2.6"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jline = { module = "org.jline:jline", version.ref = "jline" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
httpcore5-core = { module = "org.apache.httpcomponents.core5:httpcore5", version.ref = "httpcore5" }
httpcore5-h2 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version.ref = "httpcore5" }
# ── Koog Agent Framework (KMP) ──
# Stable core.
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog-stable" }
koog-skills = { module = "ai.koog:skills", version.ref = "koog-beta" }
# These clients are still published only on the beta line.
koog-google-client = { module = "ai.koog:prompt-executor-google-client", version.ref = "koog-beta" }
koog-llms-all = { module = "ai.koog:prompt-executor-llms-all", version.ref = "koog-beta" }
# Experimental integrations remain on the beta line until their APIs stabilize.
koog-mcp = { module = "ai.koog:agents-mcp", version.ref = "koog-beta" }
koog-ktor = { module = "ai.koog:koog-ktor", version.ref = "koog-beta" }
koog-a2a-server = { module = "ai.koog:agents-features-a2a-server", version.ref = "koog-beta" }
koog-a2a-client = { module = "ai.koog:agents-features-a2a-client", version.ref = "koog-beta" }
koog-a2a-transport = { module = "ai.koog:a2a-transport-server-jsonrpc-http", version.ref = "koog-beta" }
koog-a2a-transport-client = { module = "ai.koog:a2a-transport-client-jsonrpc-http", version.ref = "koog-beta" }

# ── Ktor Client ──
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }


# ── Ktor Server ──
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }

# ── Kotlinx ──
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# ── Okio ──
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }

# ── Exposed ORM ──
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
twilio = { module = "com.twilio.sdk:twilio", version.ref = "twilio" }

# ── Tracy Observability ──
tracy-core = { module = "org.jetbrains.ai.tracy:tracy-core", version.ref = "tracy" }
tracy-ktor = { module = "org.jetbrains.ai.tracy:tracy-ktor", version.ref = "tracy" }

# ── OpenTelemetry Observability ──
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-extension-kotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin", version.ref = "opentelemetry" }
opentelemetry-sdk-autoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-exporter-logging = { module = "io.opentelemetry:opentelemetry-exporter-logging", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }

# ── CLI ──
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }
mordant-markdown = { module = "com.github.ajalt.mordant:mordant-markdown", version.ref = "mordant" }

markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
markdown-renderer-coil3 = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "markdown-renderer" }

# ── Compose Multiplatform (direct coordinates) ──
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# ── Koin DI ──
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin-bom" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin-bom" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin-bom" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin-bom" }
koin-logger-slf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin-bom" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin-bom" }

[bundles]
koog-stable = ["koog-agents"]
koog-beta = ["koog-google-client", "koog-llms-all", "koog-mcp", "koog-ktor", "koog-a2a-server", "koog-a2a-client", "koog-a2a-transport", "koog-a2a-transport-client"]
ktor-client = ["ktor-client-core", "ktor-client-content-negotiation"]
ktor-server = ["ktor-server-core", "ktor-server-cio", "ktor-server-content-negotiation", "ktor-server-websockets", "ktor-server-cors", "ktor-server-status-pages", "ktor-server-sse", "ktor-serialization-json"]
tracy = ["tracy-core", "tracy-ktor"]
exposed = ["exposed-core", "exposed-dao", "exposed-jdbc", "exposed-kotlin-datetime"]
koin = ["koin-core"]
koin-compose = ["koin-compose", "koin-compose-viewmodel"]
koin-server = ["koin-ktor", "koin-logger-slf4j"]

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
tracy = { id = "org.jetbrains.ai.tracy", version.ref = "tracy" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
