<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prométhé — Agent IA autonome avec boucle Perception–Raisonnement–Action">
    <meta name="theme-color" content="#0f0f0f">
    <title>Prométhé</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f0f0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #promethe {
            width: 100%;
            height: 100%;
        }
        /* Loading state — hidden once WASM boots */
        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 9999;
            background: #0f0f0f;
            color: #a0a0a0;
            transition: opacity 0.3s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            font-size: 14px;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="loader" role="status" aria-live="polite">
        <div class="spinner"></div>
        <div class="loader-text">Loading Prométhé…</div>
    </div>
    <main style="width:100%;height:100%">
        <div id="promethe" role="application" aria-label="Prométhé Application"></div>
    </main>
    <script>
        // Runtime language switching bridge (official Compose Multiplatform recipe):
        // the app writes window.__customLocale; this patched getter makes
        // navigator.languages report it, so Compose resources re-resolve strings
        // in the selected language. Must run BEFORE promethe.js loads.
        // https://kotlinlang.org/docs/multiplatform/compose-resource-environment.html
        var currentLanguagesImplementation = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        var newLanguagesImplementation = Object.assign({}, currentLanguagesImplementation, {
            get: function () {
                if (window.__customLocale) {
                    return [window.__customLocale];
                } else {
                    return currentLanguagesImplementation.get.apply(this);
                }
            }
        });
        Object.defineProperty(Navigator.prototype, "languages", newLanguagesImplementation);
    </script>
    <script>
        // Hide loader once ComposeViewport renders (canvas or any child element)
        const hideLoader = () => {
            const loader = document.getElementById('loader');
            if (loader && !loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
                setTimeout(() => loader.remove(), 300);
                observer.disconnect();
            }
        };
        const observer = new MutationObserver(() => {
            // Compose WASM may render via canvas, div, or other elements
            const hasContent = document.querySelector('#promethe *');
            if (hasContent) hideLoader();
        });
        observer.observe(document.getElementById('promethe'), { childList: true, subtree: true });
        // Fallback: hide loader after 12s regardless
        setTimeout(hideLoader, 12000);
    </script>
    <script src="promethe.js"></script>
</body>
</html>
