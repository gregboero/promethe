# Connect only to a service implementing Promethe's /api/v1/memories contract.
# TencentCloud/TencentDB-Agent-Memory v2 uses a different API. Its current
# images are not drop-in replacements for this adapter. No guessed image is
# launched here. See docs/DEPLOYMENT.md for the compatibility limitation.
services:
  promethe-core:
    environment:
      - MEMORY_PROVIDER=tencent
      - TENCENT_MEMORY_URL=${TENCENT_MEMORY_URL:?Set a tested v1-compatible memory service URL}
      - TENCENT_SERVICE_ID=${TENCENT_SERVICE_ID:-}
      - TENCENT_MEMORY_API_KEY=${TENCENT_MEMORY_API_KEY:?Set a dedicated memory service test key}
